# Builds the data on GitHub's servers (they have internet), then publishes the
# site to GitHub Pages. Runs on every push, by hand ("Run workflow"), and every
# hour to refresh the rain. Scheduled at 20 past because GitHub warns that runs
# at the top of the hour can be delayed or dropped.

name: Build data and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_static:
        description: "Rebuild roads and terrain data from scratch"
        type: boolean
        default: false
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  static-data:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Decide whether the static data needs a rebuild
        id: need
        run: |
          want=$(python3 -c "import re;print(re.search(r'DATA_VERSION = \"([^\"]+)\"', open('pipeline/__init__.py').read()).group(1))")
          have=$(python3 -c "import json;print(json.load(open('web/public/data/meta.json')).get('data_version',''))" 2>/dev/null || echo "none")
          sample=$(python3 -c "import json;print(json.load(open('web/public/data/meta.json')).get('sample', True))" 2>/dev/null || echo "True")
          echo "wanted=$want have=$have sample=$sample"
          if [ "${{ inputs.rebuild_static }}" = "true" ] || [ "$want" != "$have" ] || [ "$sample" = "True" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.need.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install the pipeline
        if: steps.need.outputs.run == 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Run the pipeline tests
        if: steps.need.outputs.run == 'true'
        run: python -m pytest pipeline/tests -q

      - name: Build static data from real sources
        id: build
        if: steps.need.outputs.run == 'true'
        continue-on-error: true
        run: |
          mkdir -p reports
          set -o pipefail
          python -m pipeline.build --out web/public/data --report reports/build_report.md 2>&1 | tee reports/build_log.txt

      - name: Commit the data and the build report
        if: always() && steps.need.outputs.run == 'true'
        run: |
          mkdir -p reports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tail -c 150000 reports/build_log.txt > reports/build_log_tail.txt 2>/dev/null || true
          rm -f reports/build_log.txt
          if [ "${{ steps.build.outcome }}" = "success" ]; then git add web/public/data; fi
          git add reports
          git commit -m "data: static build ${{ steps.build.outcome }} [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || echo "push failed"

  deploy:
    needs: static-data
    if: always() && needs.static-data.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Refresh the rain snapshot
        run: |
          pip install -r pipeline/requirements.txt
          python -m pipeline.snapshot --data web/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build the site
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
